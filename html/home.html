<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/home.css" />
    <title>TECHSTUDY</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <h1>TECHSTUDY</h1>
        </div>
        <ul class="nav-links">
          <li><a href="#">Trang Chủ</a></li>
          <li><a href="#">Đề Thi</a></li>
          <li><a href="#">Kết Quả</a></li>
          <li><a href="#">Hỗ Trợ</a></li>
        </ul>
        <a href="register.html" class="btn">Tài Khoản</a>
      </nav>
    </header>
    <section id="home" class="hero-banner">
      <div class="hero-banner-content">
        <div class="hero-banner-image">
          <img
            id="hero-banner-img"
            src="../images/home/herobanner home.png"
            alt="Hero Banner"
          />
        </div>
        <div class="hero-banner-text">
          <h1>TECHSTUDY</h1>
          <h2>Ôn tập thông minh - Thi thử hiệu quả</h2>
        </div>
        <div class="hero-banner-subtext">
          <p>Nơi cung cấp các đề thi chất lượng và hỗ trợ học tập hiệu quả.</p>
        </div>
        <a href="./exam.html" class="btn">Bắt đầu</a>
      </div>
    </section>
    <section class="search-content">
      <input
        id="search-input"
        type="text"
        placeholder="Tìm kiếm đề thi hoặc môn học"
      />
      <div id="search-buttons" class="search-results">Tất Cả Môn</div>
      <div id="search-buttons" class="search-results">Độ Khó</div>
      <div id="search-buttons" class="search-results-main">Tìm kiếm</div>
    </section>
    <section class="home-box">
      <div class="name-box">
        <h2>Cơ sở dữ liệu</h2>
      </div>
      <div class="time-and-number">
        <p class="number-question">20 câu</p>
        <p class="time-question">15 phút</p>
      </div>
      <div class="level-exam">
        <p class="level">Trung bình</p>
      </div>
      <div class="watch-exam">
        <a href="#" class="btn">Xem Đề Thi</a>
      </div>
    </section>
  </body>
</html>
